name: E2E

# The whole flow, for real: a brig·id server built from brig-id/server-seedling,
# serving the interface built from brig-id/app, a passkey from a virtual
# authenticator, and this site. It is the end-to-end test of the sign-in of
# applications for the three repositories.
#
# The server is seedling at the head of its main, as it ships (the core and
# crypto of its Cargo.lock, the interface of its APP_REF). A branch of the same
# name with an open pull request in another repository is taken instead: a
# change that spans repositories is tested whole before it is merged. The steps
# are in brig-id/.github, integration.yml, which the server, the core, crypto
# and the interface run with their own changes: a change there that breaks this
# site is seen there, before it is merged.

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: brig-id/.github/.github/workflows/integration.yml@main
    with:
      heads: false
      suites: demo
